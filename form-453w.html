<style>

:root{
  --bg:#f4eee4; --card:#ffffff; --ink:#1f3744; --ink2:#4a6372; --line:#e2d8c8;
  --navy:#2f4e5f; --navy-ink:#f4eee4; --coral:#f58e77; --coral-soft:#fde3da; --red:#b4472f;
  --yes:#2f7f72; --yes-soft:#dcefeb; --partly:#b4472f; --partly-soft:#fde3da; --no:#c44147; --no-soft:#f8dfe0; --teal:#3d9283;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18272f; --card:#21353f; --ink:#f1ebe1; --ink2:#b7c3c9; --line:#33505e;
  --navy:#21353f; --navy-ink:#f1ebe1; --coral:#f58e77; --coral-soft:#3b2b27; --red:#f7a48f;
  --yes:#6cc2b3; --yes-soft:#1c3a36; --partly:#f7a48f; --partly-soft:#3b2b27; --no:#f08a8f; --no-soft:#3d2225; --teal:#2f7f72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18272f; --card:#21353f; --ink:#f1ebe1; --ink2:#b7c3c9; --line:#33505e;
  --navy:#21353f; --navy-ink:#f1ebe1; --coral:#f58e77; --coral-soft:#3b2b27; --red:#f7a48f;
  --yes:#6cc2b3; --yes-soft:#1c3a36; --partly:#f7a48f; --partly-soft:#3b2b27; --no:#f08a8f; --no-soft:#3d2225; --teal:#2f7f72; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;margin:0}
.col{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
header{background:var(--navy);color:var(--navy-ink);padding-block:18px 14px}
.mock{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--coral);color:#1f3744;border-radius:999px;padding:2px 10px}
h1{font-size:24px;margin:8px 0 0;font-weight:800;letter-spacing:-.01em}
.sub{margin:2px 0 0;opacity:.85;font-size:14px}
.steps{display:flex;gap:4px;margin-top:14px}
.steps button{flex:1;min-width:0;border:0;background:rgba(255,255,255,.12);color:var(--navy-ink);border-radius:8px;padding:7px 2px 6px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:2px}
.steps svg{width:18px;height:18px;opacity:.9}
.steps .tg{font-size:13px;font-weight:700}
.steps .te{font-size:9.5px;font-weight:500;opacity:.85;line-height:1.15;text-align:center;max-width:100%}
.steps button[aria-current="step"]{background:var(--coral);color:#1f3744}
.steps button.done{background:rgba(245,142,119,.35)}
main{padding-block:18px 110px}
h2{font-size:20px;margin:0 0 4px}
.lead{color:var(--ink2);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
label.f{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
.field{margin-bottom:14px}
select,input[type=text],input[type=date],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:64px;resize:vertical}
.hint{font-size:12.5px;color:var(--ink2);margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.ver{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--teal)}
.q{border-left:4px solid var(--line)}
.q[data-a="yes"]{border-left-color:var(--yes)}.q[data-a="partly"]{border-left-color:var(--partly)}.q[data-a="no"]{border-left-color:var(--no)}
.qtop{display:flex;gap:8px;align-items:flex-start}
.id{flex:0 0 auto;background:var(--navy);color:var(--navy-ink);font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:2px}
.qt{margin:0;font-weight:600}
.std{margin:3px 0 0;font-size:12.5px;color:var(--ink2)}
.nat{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--teal);color:#fff;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.ans{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.ans button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 0;font-weight:700;font-size:14px;color:var(--ink2)}
.ans button[data-v="yes"][aria-pressed="true"]{background:var(--yes-soft);border-color:var(--yes);color:var(--yes)}
.ans button[data-v="partly"][aria-pressed="true"]{background:var(--partly-soft);border-color:var(--partly);color:var(--partly)}
.ans button[data-v="no"][aria-pressed="true"]{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.chal{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.chal .f{font-size:12.5px}
.own{border-style:dashed}
.add{width:100%;border:1px dashed var(--navy);background:none;color:var(--navy);border-radius:10px;padding:11px;font-weight:700;margin-bottom:10px}
:root[data-theme="dark"] .add{color:var(--coral);border-color:var(--coral)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .add{color:var(--coral);border-color:var(--coral)}}
.rm{border:0;background:none;color:var(--ink2);text-decoration:underline;font-size:12px;padding:0;margin-top:8px}
.sumrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.sumrow:first-of-type{border-top:0}
.stack{display:flex;gap:2px;height:10px;margin:8px 0}
.stack span{display:block;height:100%}
.goal{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0}
.rank{font-weight:800;color:var(--red);font-size:18px}
.gt{margin:0;font-weight:700}
.gm{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
.adopt{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;margin-top:6px}
.adopt input{width:17px;height:17px;accent-color:var(--navy)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .col{display:flex;gap:10px;padding-block:10px}
.bar button{flex:1;border-radius:10px;padding:12px;font-weight:700;border:1px solid var(--line);background:var(--card)}
.bar .next{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
:root[data-theme="dark"] .bar .next{background:var(--coral);color:#1f3744}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar .next{background:var(--coral);color:#1f3744}}
.count{font-size:12.5px;color:var(--ink2);margin:-6px 0 12px}
.done{text-align:center;padding-top:30px}
.done .big{font-size:44px;line-height:1}
.next-list{text-align:left}
@media (prefers-reduced-motion:no-preference){.q{transition:border-color .15s}}
</style>
</head>

  {id:"p3",sec:"c",w:2,tier:"ab",q:"Are local officials and police met at least once a year about mandir safety?",std:"For example, a safety session or forum with local police and officials.",x:"the yearly safety meeting",goal:"Hold one safety meeting a year with local officials and police"},
  {id:"p4",sec:"c",w:1,q:"Is the mandir website kept current (events, news, timings)?",std:"Every mandir has a website manager.",x:"the website",goal:"Keep the mandir website current every month"},
  {id:"p5",sec:"c",w:2,tier:"ab",q:"Are relations kept with mainstream and ethnic media for major events?",std:"",x:"media relations",goal:"Keep a media contact list for major events"},
  {id:"p6",sec:"c",w:3,tier:"ab",q:"Is a trained spokesperson ready to speak to media, only with the sant's approval?",std:"",x:"the spokesperson",goal:"Train one spokesperson for media"},
  {id:"p7",sec:"r",w:2,q:"Is a media calendar kept and are posts approved before going out?",std:"",x:"the media calendar",goal:"Keep a media calendar with approvals"},
  {id:"p8",sec:"r",w:2,q:"Does the PA/Comm admin join the monthly regional PA/Comm call?",std:"",x:"the regional call",goal:"Join the regional PA/Comm call every month"},
 ]}
];


const EX = {
 satsang:{k1:["no","time"],k2:["yes"],k3:["yes"],k4:["partly","owner"],k5:["no","owner"],s1:["partly","time"],s2:["yes"],s3:["partly","time"],s4:["no","how"],s5:["no","how"],s6:["partly","owner"],s7:["partly","tools"],s8:["partly","time"],s9:["yes"],s10:["partly","engage"]},
 network:{k1:["partly","time"],k2:["yes"],k3:["yes"],k4:["partly","owner"],k5:["no","how"],n1:["yes"],n2:["partly","owner"],n3:["no","how"],n4:["no","time"],n5:["partly","tools"],n6:["no","owner"],n7:["yes"],n8:["partly","engage"],n9:["partly","engage"],n10:["no","tools"]},
 services:{k1:["no","time"],k2:["yes"],k3:["partly","time"],k4:["partly","owner"],k5:["no","owner"],v1:["yes"],v2:["partly","engage"],v3:["partly","tools"],v4:["partly","other"],v5:["yes"],v6:["partly","engage"],v7:["yes"]},
 facility:{k1:["partly","engage"],k2:["yes"],k3:["yes"],k4:["yes"],k5:["no","owner"],f1:["partly","time"],f2:["partly","time"],f3:["partly","tools"],f4:["no","owner"],f5:["yes"],f6:["no","owner"],f7:["partly","how"],f8:["yes"],f9:["partly","time"]},
 avit:{k1:["no","time"],k2:["partly","owner"],k3:["partly","time"],k4:["partly","owner"],k5:["no","how"],a1:["yes"],a2:["no","how"],a3:["partly","time"],a4:["no","owner"],a5:["partly","engage"],a6:["partly","how"],a7:["no","tools"],a8:["yes"]},
 ca:{k1:["no","time"],k2:["partly","owner"],k3:["yes"],k4:["partly","owner"],k5:["no","owner"],c1:["partly","owner"],c2:["no","how"],c3:["yes"],c4:["partly","engage"],c5:["no","time"],c6:["partly","tools"],c7:["no","owner"],c8:["partly","engage"]},
 pa:{k1:["partly","time"],k2:["no","owner"],k3:["yes"],k4:["partly","owner"],k5:["no","owner"],p1:["partly","owner"],p2:["partly","how"],p3:["yes"],p4:["partly","tools"],p5:["no","how"],p6:["no","owner"],p7:["no","owner"],p8:["partly","time"]}
};


const MANDIRS = [["Raleigh","ab"],["Charlotte","ab"],["Greensboro","ab"],["Greenville SC","ab"],["Fayetteville","cd"],["Myrtle Beach","cd"],["Asheville","cd"],["Perry","cd"]];
const ESIDE_ONLY = ["facility","avit"];
const STEPS = [["about","પરિચય","About us"],["ang-1","ઘડતર","Karyakars"],["ang-2","પ્રવૃત્તિ","Core Activities"],["ang-3","વિમર્શ","Vimarsh, Reporting & Communication"],["review","સંકલ્પ","Our goals"]];
const TAB_ICONS = {"about": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" height=\"18\" width=\"18\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><path d=\"M12 16v-4\"></path><path d=\"M12 8h.01\"></path></svg>", "ang-1": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" height=\"18\" width=\"18\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"></path><circle cx=\"9\" cy=\"7\" r=\"4\"></circle><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"></path><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"></path></svg>", "ang-2": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" height=\"18\" width=\"18\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"></path><path d=\"M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08c.82.82 2.13.85 3 .07l2.07-1.9a2.82 2.82 0 0 1 3.79 0l2.96 2.66\"></path><path d=\"m18 15-2-2\"></path><path d=\"m15 18-2-2\"></path></svg>", "ang-3": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" height=\"18\" width=\"18\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z\"></path><path d=\"M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1\"></path></svg>", "review": "<svg stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" height=\"18\" width=\"18\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><circle cx=\"12\" cy=\"12\" r=\"6\"></circle><circle cx=\"12\" cy=\"12\" r=\"2\"></circle></svg>"};
const ANG = {"ang-1":["k","અંગ 1 · Karyakars","ઘડતર · Are our karyakars growing? The same five items in every department."],
             "ang-2":["c","અંગ 2 · Core Activities","પ્રવૃત્તિ · Is our main seva running well?"],
             "ang-3":["r","અંગ 3 · Vimarsh, Reporting & Communication","વિમર્શ · Do we reflect, report and stay connected?"]};
const S = {mandir:"Raleigh", side:"e", dept:"satsang", by:["Admin","Activity coordinators","Team leads"], date:"2026-12-12",
           ans:{}, own:{k:[],c:[],r:[]}, adopted:new Set(), note:"", submitted:false};
(EX.satsang ? Object.entries(EX.satsang) : []).forEach(([k,v]) => S.ans[k] = {a:v[0], c:v[1]||null, note:""});
S.own.c.push({id:"u1", q:"Kirtan team practises before every sabha"}); S.ans.u1 = {a:"partly", c:"time", note:""};
let step = "about", ownSeq = 1;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tier = () => (MANDIRS.find(m => m[0] === S.mandir) || [,"ab"])[1];
const dept = () => DEPTS.find(d => d.id === S.dept);
const items = sec => [...COMMON, ...dept().items].filter(i => i.sec === sec && (tier() === "ab" || i.tier !== "ab"));
const ownItems = sec => S.own[sec].map(o => ({id:o.id, sec, w:2, own:true, q:o.q, x:o.q ? "“"+o.q.toLowerCase()+"”" : "this item", goal:o.q || "Our own item"}));
const allItems = () => ["k","c","r"].flatMap(s => [...items(s), ...ownItems(s)]);

function renderSteps(){
  const ix = STEPS.findIndex(s => s[0] === step);
  document.getElementById("steps").innerHTML = STEPS.map(([id,g,e],k) =>
    `<button type="button" data-go="${id}" ${id===step?'aria-current="step"':""} class="${k<ix?"done":""}" aria-label="${e}">${TAB_ICONS[id]}<span class="tg">${g}</span><span class="te">${e}</span></button>`).join("");
}
function about(){
  const iside = S.side === "i";
  return `<h2>પરિચય · About your team</h2><p class="lead">Fill this in together: the admin with coordinators and team leads, about 15 minutes, two or three weeks before LAM.</p>
  <div class="card">
    <div class="field"><label class="f" for="mandir">Mandir</label><select id="mandir">${MANDIRS.map(([m]) => `<option ${m===S.mandir?"selected":""}>${m}</option>`).join("")}</select>
      <span class="ver">${tier()==="ab" ? "Full list (Type A/B)" : "Lighter list (Type C/D)"}</span></div>
    <div class="field"><span class="f">Side</span><div class="chips">
      <button type="button" class="chip" data-side="e" aria-pressed="${S.side==="e"}">e-side</button>
      <button type="button" class="chip" data-side="i" aria-pressed="${S.side==="i"}">i-side</button></div>
      <p class="hint">e-side and i-side fill the form separately.</p></div>
    <div class="field"><span class="f">Department</span><div class="chips">${DEPTS.map(d => `<button type="button" class="chip" data-dept="${d.id}" aria-pressed="${d.id===S.dept}" ${iside && ESIDE_ONLY.includes(d.id) ? "disabled" : ""}>${esc(d.name)}</button>`).join("")}</div></div>
    <div class="field"><span class="f">Who filled it in</span><div class="chips">${["Admin","Activity coordinators","Team leads","RC"].map(b => `<button type="button" class="chip" data-by="${b}" aria-pressed="${S.by.includes(b)}">${b}</button>`).join("")}</div></div>
    <div class="field" style="margin-bottom:0"><label class="f" for="date">Date</label><input type="date" id="date" value="${S.date}"></div>
  </div>`;
}
function qCard(i){
  const st = S.ans[i.id] || {};
  const b = v => `<button type="button" data-q="${i.id}" data-v="${v}" aria-pressed="${st.a===v}">${v[0].toUpperCase()+v.slice(1)}</button>`;
  const head = i.own
    ? `<div style="flex:1"><label class="f" for="own-${i.id}">Our own item</label><input type="text" id="own-${i.id}" data-own="${i.id}" value="${esc(i.q)}" placeholder="Describe an activity your team wants to check"></div>`
    : `<span class="id">${i.id.toUpperCase()}</span><div><p class="qt">${esc(i.q)}${i.nat?'<span class="nat">National focus</span>':""}</p>${i.std?`<p class="std">${esc(i.std)}</p>`:""}</div>`;
  const chal = (st.a==="partly"||st.a==="no") ? `<div class="chal"><span class="f">What is the main challenge?</span><div class="chips">${Object.entries(CH).map(([k,c]) =>
      `<button type="button" class="chip" data-q="${i.id}" data-c="${k}" aria-pressed="${st.c===k}">${esc(c.label)}</button>`).join("")}</div>
      <label class="f" for="note-${i.id}" style="margin-top:10px">Note (optional)</label><textarea id="note-${i.id}" data-note="${i.id}" placeholder="Anything the RC should know">${esc(st.note)}</textarea></div>` : "";
  return `<div class="card q${i.own?" own":""}" data-a="${st.a||""}"><div class="qtop">${head}</div><div class="ans" role="group" aria-label="Answer">${b("yes")}${b("partly")}${b("no")}</div>${chal}${i.own?`<button type="button" class="rm" data-rm="${i.id}">Remove this item</button>`:""}</div>`;
}
function angView(){
  const [sec,title,lead] = ANG[step];
  const list = [...items(sec), ...ownItems(sec)];
  const done = list.filter(i => S.ans[i.id]?.a).length;
  return `<h2>${title}</h2><p class="lead">${lead}</p><p class="count">${dept().name} · ${done} of ${list.length} answered</p>
    ${list.map(qCard).join("")}<button type="button" class="add" data-add="${sec}">+ Add our own item</button>`;
}
function candidates(){
  return allItems().map((i,ix) => ({i, ix, s:S.ans[i.id]})).filter(o => o.s && (o.s.a==="no"||o.s.a==="partly"))
    .map(o => ({...o, score:(4-o.i.w)*2 + (o.s.a==="no"?1:0)})).sort((a,b) => b.score-a.score || a.ix-b.ix);
}
function review(){
  const all = allItems(); const c = {yes:0,partly:0,no:0,open:0};
  all.forEach(i => c[S.ans[i.id]?.a || "open"]++);
  const pct = n => (n/all.length*100).toFixed(1)+"%";
  const per = ["k","c","r"].map((s,k) => { const l=[...items(s),...ownItems(s)]; return [`${STEPS[k+1][1]} · ${STEPS[k+1][2]}`, l.filter(i=>S.ans[i.id]?.a==="yes").length, l.length]; });
  const top = candidates().slice(0,3);
  return `<h2>સંકલ્પ · Review and choose our goals</h2><p class="lead">${esc(S.mandir)} · ${S.side}-side · ${esc(dept().name)}</p>
  <div class="card"><span class="f">Where we stand</span>
    <div class="stack" aria-hidden="true">${[["yes","var(--yes)"],["partly","var(--partly)"],["no","var(--no)"],["open","var(--line)"]].filter(([k])=>c[k]).map(([k,col])=>`<span style="width:${pct(c[k])};background:${col}"></span>`).join("")}</div>
    <p class="hint" style="margin-bottom:6px">Yes ${c.yes} · Partly ${c.partly} · No ${c.no}${c.open?` · Not answered ${c.open}`:""}</p>
    ${per.map(([n,y,t]) => `<div class="sumrow"><span>${n}</span><b>${y} of ${t} in place</b></div>`).join("")}</div>
  <div class="card"><span class="f">Suggested 2027 goals</span><p class="hint">Core items first, and a No before a Partly. Tick the ones to take to the LAM breakout.</p>
    ${top.length ? top.map((o,k) => `<div class="goal"><div class="rank">${k+1}</div><div><p class="gt">${esc(o.i.goal)}</p>
      <p class="gm">${o.i.own?"Our own item":o.i.id.toUpperCase()} · ${o.s.a}${o.s.c?" · "+esc(CH[o.s.c].label.toLowerCase()):""}</p>
      <label class="adopt"><input type="checkbox" id="adopt-${o.i.id}" data-adopt="${o.i.id}" ${S.adopted.has(o.i.id)?"checked":""}> Make it a 2027 goal</label></div></div>`).join("")
      : `<p class="hint">No gaps yet.</p>`}</div>
  <div class="card"><label class="f" for="rcnote">Anything else for the RC and RA?</label><textarea id="rcnote" placeholder="For example, help you need from the region">${esc(S.note)}</textarea></div>`;
}
function doneView(){
  return `<div class="done"><div class="big">🙏</div><h2>Submitted</h2><p class="lead">Mock-up only: nothing was sent.</p></div>
  <div class="card next-list"><span class="f">What happens next</span>
    <div class="sumrow"><span>Your one-page summary goes to the admin and RC</span><b>Before LAM</b></div>
    <div class="sumrow"><span>The team confirms it and picks 2–3 goals</span><b>LAM breakout</b></div>
    <div class="sumrow"><span>The team plans each goal: owner, first step, date</span><b>LAM breakout</b></div>
    <div class="sumrow"><span>Answer the same form again</span><b>May · Sep · Jan</b></div></div>`;
}
function render(){
  renderSteps();
  const v = document.getElementById("view");
  v.innerHTML = S.submitted ? doneView() : step === "about" ? about() : step === "review" ? review() : angView();
  const ix = STEPS.findIndex(s => s[0] === step);
  document.getElementById("back").hidden = ix === 0 || S.submitted;
  const nx = document.getElementById("next");
  nx.textContent = S.submitted ? "Start again" : step === "review" ? "Submit" : "Next";
}
function go(id){ step = id; S.submitted = false; try { history.replaceState(null, "", "#" + id); } catch(e) {} render(); window.scrollTo(0,0); }

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  if(t.id === "next"){ if(S.submitted){ go("about"); return; } const ix = STEPS.findIndex(s => s[0] === step); if(step === "review"){ S.submitted = true; render(); window.scrollTo(0,0); } else go(STEPS[ix+1][0]); return; }
  if(t.id === "back"){ const ix = STEPS.findIndex(s => s[0] === step); if(ix > 0) go(STEPS[ix-1][0]); return; }
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.side){ S.side = t.dataset.side; if(S.side==="i" && ESIDE_ONLY.includes(S.dept)) S.dept = "satsang"; render(); return; }
  if(t.dataset.dept){ S.dept = t.dataset.dept; render(); return; }
  if(t.dataset.by){ const b = t.dataset.by; S.by = S.by.includes(b) ? S.by.filter(x => x!==b) : [...S.by, b]; render(); return; }
  if(t.dataset.add){ const id = "u" + (++ownSeq); S.own[t.dataset.add].push({id, q:""}); render(); const el = document.getElementById("own-"+id); if(el) el.focus(); return; }
  if(t.dataset.rm){ for(const k of "kcr") S.own[k] = S.own[k].filter(o => o.id !== t.dataset.rm); delete S.ans[t.dataset.rm]; render(); return; }
  const q = t.dataset.q; if(!q) return;
  const cur = S.ans[q] || {note:""};
  if(t.dataset.v){ S.ans[q] = {...cur, a:t.dataset.v, c: t.dataset.v==="yes" ? null : cur.c || null}; }
  else if(t.dataset.c){ S.ans[q] = {...cur, c: cur.c===t.dataset.c ? null : t.dataset.c}; }
  render();
});
document.addEventListener("input", e => {
  const d = e.target.dataset || {};
  if(e.target.id === "date") S.date = e.target.value;
  if(e.target.id === "rcnote") S.note = e.target.value;
  if(d.note){ S.ans[d.note] = {...(S.ans[d.note]||{}), note:e.target.value}; }
  if(d.own){ for(const k of "kcr"){ const o = S.own[k].find(x => x.id === d.own); if(o) o.q = e.target.value; } }
});
document.addEventListener("change", e => {
  if(e.target.id === "mandir"){ S.mandir = e.target.value; render(); }
  if(e.target.dataset && e.target.dataset.adopt){ const id = e.target.dataset.adopt; e.target.checked ? S.adopted.add(id) : S.adopted.delete(id); }
});
const start = (location.hash || "").slice(1);
if(STEPS.some(s => s[0] === start)) step = start;
render();
</script>
</body>
</html>
